# --- General ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g status-keys emacs
set -g aggressive-resize on
set -g allow-passthrough on
# Switch to another session instead of detaching when one is closed
set -g detach-on-destroy off
# Unconditionally forward extended key sequences to all inner panes
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

# --- Numbering ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Titles & messages ---
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g display-time 2000
set -g display-panes-time 2000
set -g monitor-activity off

# --- Prefix: Ctrl+Space ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Keybindings ---
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Copy mode (vi)
unbind [
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -n C-S-H resize-pane -L 5
bind -n C-S-J resize-pane -D 5
bind -n C-S-K resize-pane -U 5
bind -n C-S-L resize-pane -R 5
bind -n C-Enter resize-pane -Z

# Windows
bind -n C-s split-window -h -c "#{pane_current_path}"
bind -n C-S-S split-window -v -c "#{pane_current_path}"
bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-w kill-window
bind -n C-[ previous-window
bind -n C-] next-window
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5

# Sessions
bind o choose-tree -Zs
bind n command-prompt -p "New session name:" "new-session -d -s '%%' ; switch-client -t '%%'"
bind r command-prompt -I "#S" "rename-session '%%'"
bind d confirm-before -p "Kill session #S? (y/n)" kill-session
bind -r [ switch-client -p
bind -r ] switch-client -n
bind Tab switch-client -l

# --- Appearance ---
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-left "#[bold,fg=green][#S] "
set -g status-right "#[fg=brightblack]#H #[fg=white]%a %d %b %H:%M"
set -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-format "#[bold,fg=cyan] #I:#W#{?window_flags,#{window_flags},} "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g message-style "bg=default,fg=yellow"
set -g mode-style "bg=cyan,fg=black"

